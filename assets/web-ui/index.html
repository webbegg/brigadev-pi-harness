<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>brigadev</title>
<style>
:root {
	--bg: #0f1115; --panel: #161a21; --panel2: #1c212a; --line: #262c37; --text: #d7dce4; --dim: #8892a3;
	--accent: #6aa8ff; --ok: #4cc38a; --warn: #e5b04a; --bad: #ef6b6b; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: #274a7c; border-color: #355f9d; }
button.good { background: #1f4a37; border-color: #2c6a4f; }
button.danger { background: #55292b; border-color: #7a3a3d; }
input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
input:focus, textarea:focus { outline: 1px solid var(--accent); }

header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .02em; }
.crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.crumb { padding: 1px 9px; border-radius: 10px; color: var(--dim); border: 1px solid transparent; font-size: 12px; }
.crumb.visited { color: var(--text); border-color: var(--line); }
.crumb.active { color: #fff; background: #274a7c; border-color: #355f9d; }
.crumb + .crumb::before { content: "›"; color: var(--line); margin-right: 6px; margin-left: -4px; }
.hint { color: var(--dim); font-size: 11px; font-style: italic; }
.spacer { flex: 1; }
.pill { padding: 1px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.pill.on { color: var(--ok); border-color: #2c6a4f; }
.pill.off { color: var(--bad); border-color: #7a3a3d; }
.pill.busy { color: var(--accent); border-color: #355f9d; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } aside { max-height: 45vh; } }
#convo { overflow-y: auto; padding: 10px 14px; border-right: 1px solid var(--line); }
#timeline { display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 92%; padding: 6px 10px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); }
.msg .who { display: block; font-size: 11px; color: var(--dim); margin-bottom: 2px; }
.msg.user { align-self: flex-end; background: #1d2a40; border-color: #2c4163; }
.msg.assistant { align-self: flex-start; background: var(--panel); }
.tool { display: flex; gap: 8px; align-items: baseline; padding: 1px 8px; color: var(--dim); font-family: var(--mono); font-size: 12px; min-width: 0; }
.tool .ico { width: 1em; text-align: center; flex: none; }
.tool.running .ico { color: var(--accent); animation: pulse 1s infinite; }
.tool.done .ico { color: var(--ok); }
.tool.error .ico { color: var(--bad); }
.tool .name { color: var(--text); flex: none; }
.tool .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.tool .dur { flex: none; font-size: 11px; }
#live { margin-top: 6px; }
#live .msg { opacity: .85; border-style: dashed; }
@keyframes pulse { 50% { opacity: .3; } }
.empty { color: var(--dim); font-style: italic; padding: 4px 2px; }

aside { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
section.panel > h2 { margin: 0; padding: 6px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
section.panel > .body { padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.card .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card .title { font-weight: 600; overflow-wrap: anywhere; }
.card .meta { color: var(--dim); font-size: 12px; }
.card pre { margin: 4px 0 0; max-height: 90px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.35 var(--mono); color: var(--dim); }
.badge { font-size: 11px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--line); color: var(--dim); }
.badge.running, .badge.open, .badge.confirm { color: var(--accent); border-color: #355f9d; }
.badge.done, .badge.pass, .badge.allow, .badge.answered { color: var(--ok); border-color: #2c6a4f; }
.badge.failed, .badge.fail, .badge.block, .badge.cancelled, .badge.dismissed { color: var(--bad); border-color: #7a3a3d; }
.badge.queued { color: var(--warn); border-color: #7a6130; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.opt { text-align: left; display: block; width: 100%; }
.opt .d { display: block; color: var(--dim); font-size: 11px; }
.rec { color: var(--warn); font-size: 11px; margin-left: 6px; }
.free { display: flex; gap: 6px; margin-top: 6px; }
.free input { flex: 1; min-width: 0; }
details.card > summary { cursor: pointer; list-style: none; }
.todo { display: flex; gap: 6px; }
.todo .mark { width: 1.2em; flex: none; text-align: center; color: var(--dim); }
.todo.done .txt { color: var(--dim); text-decoration: line-through; }
.todo.in_progress .mark { color: var(--accent); }
.mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

footer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 8px; align-items: flex-end; }
footer textarea { flex: 1; resize: vertical; min-height: 38px; max-height: 30vh; }
#toast { position: fixed; right: 14px; bottom: 70px; background: #55292b; border: 1px solid #7a3a3d; padding: 6px 12px; border-radius: 6px; display: none; max-width: 60ch; }
</style>
</head>
<body>
<header>
	<span class="brand">brigadev</span>
	<div class="crumbs" id="crumbs"></div>
	<span class="hint" id="hint" title="The phase is guessed from tool activity, not declared by the model.">inferred</span>
	<span class="spacer"></span>
	<span class="pill" id="mode">mode: –</span>
	<span class="pill" id="run">idle</span>
	<span class="pill" id="conn">connecting…</span>
</header>
<main>
	<div id="convo">
		<div id="timeline"></div>
		<div id="live"></div>
		<div class="empty" id="empty">Waiting for activity…</div>
	</div>
	<aside>
		<section class="panel"><h2><span>Agents</span><span id="n-agents"></span></h2><div class="body" id="agents"></div></section>
		<section class="panel"><h2><span>Prompts</span><span id="n-prompts"></span></h2><div class="body" id="prompts"></div></section>
		<section class="panel"><h2><span>Checks</span></h2><div class="body" id="checks"></div></section>
		<section class="panel"><h2><span>Todos</span></h2><div class="body" id="todos"></div></section>
		<section class="panel"><h2><span>Guard</span></h2><div class="body" id="guard"></div></section>
	</aside>
</main>
<footer>
	<textarea id="input" rows="2" placeholder="Message the agent… (Ctrl/Cmd+Enter to send)"></textarea>
	<button class="primary" id="send" title="Send; queued as a follow-up while the agent is running">Send</button>
	<button id="steer" title="Interrupt the current run with this message">Steer</button>
	<button class="danger" id="abort" title="Abort the current run">Abort</button>
</footer>
<div id="toast" role="alert"></div>
<script>
"use strict";
(function () {
	var STEPS = ["authorize", "explore", "decide", "implement", "check", "commit", "close"];
	var TOKEN = new URLSearchParams(location.search).get("token") || "";
	var MAX_TIMELINE = 1000;
	var state = {
		phase: null, mode: null, running: false, live: { active: false, text: "" },
		timeline: new Map(), agents: new Map(), prompts: new Map(), checks: [], todos: [], guard: [],
	};
	var pending = new Set(); // prompt/agent ids with an action in flight

	// ---- tiny DOM helpers: text only goes in through textContent, never innerHTML ----
	function h(tag, props) {
		var el = document.createElement(tag);
		if (props) for (var k in props) {
			var v = props[k];
			if (v === undefined || v === null || v === false) continue;
			if (k === "class") el.className = v;
			else if (k === "text") el.textContent = String(v);
			else if (k === "title") el.title = String(v);
			else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
			else if (k === "disabled") el.disabled = !!v;
			else el.setAttribute(k, String(v));
		}
		for (var i = 2; i < arguments.length; i++) {
			var c = arguments[i];
			if (c === undefined || c === null || c === false) continue;
			el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
		}
		return el;
	}
	function $(id) { return document.getElementById(id); }
	function time(at) { return at ? new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""; }
	function toast(message) {
		var el = $("toast");
		el.textContent = String(message);
		el.style.display = "block";
		clearTimeout(toast.t);
		toast.t = setTimeout(function () { el.style.display = "none"; }, 5000);
	}

	// Keeps `parent`'s children in the order of `items`, rebuilding only the ones whose signature changed.
	function reconcile(parent, items, keyOf, build, emptyText) {
		var existing = new Map();
		Array.prototype.forEach.call(parent.children, function (el) { if (el._key !== undefined) existing.set(el._key, el); });
		var seen = new Set(), prev = null;
		items.forEach(function (item) {
			var key = keyOf(item), sig = JSON.stringify(item), el = existing.get(key);
			if (!el || el._sig !== sig) {
				var next = build(item);
				next._key = key; next._sig = sig;
				if (el) el.replaceWith(next);
				el = next;
			}
			seen.add(key);
			var expected = prev ? prev.nextElementSibling : parent.firstElementChild;
			if (expected !== el) parent.insertBefore(el, expected);
			prev = el;
		});
		existing.forEach(function (el, key) { if (!seen.has(key)) el.remove(); });
		var note = parent.querySelector(":scope > .empty");
		if (!items.length && emptyText) { if (!note) parent.appendChild(h("div", { class: "empty", text: emptyText })); }
		else if (note) note.remove();
	}

	// ---- actions ----
	function post(body) {
		return fetch("/action", { method: "POST", headers: { "content-type": "application/json", "x-brigadev-token": TOKEN }, body: JSON.stringify(body) })
			.then(function (res) {
				if (res.status !== 202) throw new Error("action rejected (" + res.status + ")");
			});
	}
	function act(key, body, done) {
		if (key) { pending.add(key); render(); }
		post(body).then(function () { if (done) done(); }, function (e) { toast(e.message || e); })
			.then(function () { if (key) { pending.delete(key); render(); } });
	}

	// ---- folding events into state ----
	var lastSeq = 0;
	function fold(event) {
		if (!event || typeof event.type !== "string") return;
		if (typeof event.seq === "number") lastSeq = Math.max(lastSeq, event.seq);
		var d = event.data || {};
		switch (event.type) {
			case "brigadev_phase": state.phase = d; break;
			case "brigadev_mode": state.mode = d.mode || null; break;
			case "run": state.running = !!d.running; break;
			case "assistant_live": state.live = { active: !!d.active, text: String(d.text || "") }; break;
			case "message": putTimeline("m:" + d.id, event.seq, "message", d); break;
			case "tool": putTimeline("t:" + d.id, event.seq, "tool", d); break;
			case "brigadev_agent": if (d.id) state.agents.set(d.id, d); break;
			case "brigadev_prompt": if (d.id) state.prompts.set(d.id, d); break;
			case "brigadev_check": state.checks.unshift(d); state.checks.length = Math.min(state.checks.length, 30); break;
			case "brigadev_guard": state.guard.unshift(d); state.guard.length = Math.min(state.guard.length, 50); break;
			case "brigadev_todo": state.todos = Array.isArray(d.todos) ? d.todos : []; break;
		}
	}
	function putTimeline(key, seq, kind, data) {
		var old = state.timeline.get(key);
		state.timeline.set(key, { key: key, seq: old ? old.seq : seq, kind: kind, data: data });
		if (state.timeline.size > MAX_TIMELINE) state.timeline.delete(state.timeline.keys().next().value);
	}

	// ---- rendering ----
	var scheduled = false;
	function render() {
		if (scheduled) return;
		scheduled = true;
		requestAnimationFrame(function () { scheduled = false; draw(); });
	}

	function drawHeader() {
		var p = state.phase || {}, visited = Array.isArray(p.visited) ? p.visited : [];
		reconcile($("crumbs"), STEPS.map(function (s) { return { s: s, v: visited.indexOf(s) >= 0, a: p.phase === s }; }), function (i) { return i.s; }, function (i) {
			return h("span", { class: "crumb" + (i.v ? " visited" : "") + (i.a ? " active" : ""), text: i.s, title: i.a && p.detail ? p.detail : null });
		});
		$("hint").style.display = p.source === "inferred" || !state.phase ? "" : "none";
		$("mode").textContent = "mode: " + (state.mode || "–");
		var run = $("run");
		run.textContent = state.running ? "running" : "idle";
		run.className = "pill" + (state.running ? " busy" : "");
	}

	function drawTimeline() {
		var convo = $("convo");
		var stick = convo.scrollHeight - convo.scrollTop - convo.clientHeight < 80;
		var items = Array.from(state.timeline.values()).sort(function (a, b) { return a.seq - b.seq; });
		reconcile($("timeline"), items, function (i) { return i.key; }, function (i) {
			var d = i.data;
			if (i.kind === "message") {
				return h("div", { class: "msg " + (d.role === "user" ? "user" : "assistant") },
					h("span", { class: "who", text: (d.role === "user" ? "you" : "assistant") + (d.at ? " · " + time(d.at) : "") }), String(d.text || ""));
			}
			var icon = d.status === "running" ? "●" : d.status === "error" ? "✗" : "✓";
			return h("div", { class: "tool " + (d.status || "") },
				h("span", { class: "ico", text: icon }), h("span", { class: "name", text: d.name || "tool" }),
				h("span", { class: "sum", text: d.summary || "", title: d.summary || "" }),
				d.durationMs != null ? h("span", { class: "dur", text: d.durationMs >= 1000 ? (d.durationMs / 1000).toFixed(1) + "s" : Math.round(d.durationMs) + "ms" }) : null);
		});
		$("empty").style.display = items.length || state.live.active ? "none" : "";
		var live = $("live");
		if (state.live.active && state.live.text) {
			if (!live.firstChild) live.appendChild(h("div", { class: "msg assistant" }, h("span", { class: "who", text: "assistant · typing…" }), h("span", { class: "t" })));
			live.querySelector(".t").textContent = state.live.text;
		} else live.replaceChildren();
		if (stick) convo.scrollTop = convo.scrollHeight;
	}

	function tokens(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n || 0); }
	var AGENT_RANK = { running: 0, queued: 1, failed: 2, cancelled: 3, done: 4 };
	function drawAgents() {
		var list = Array.from(state.agents.values()).sort(function (a, b) {
			return (AGENT_RANK[a.status] ?? 5) - (AGENT_RANK[b.status] ?? 5) || (b.startedAt || 0) - (a.startedAt || 0);
		});
		$("n-agents").textContent = list.length ? String(list.length) : "";
		reconcile($("agents"), list, function (a) { return a.id; }, function (a) {
			var cancellable = a.cancellable && (a.status === "running" || a.status === "queued");
			return h("div", { class: "card" },
				h("div", { class: "row" }, h("span", { class: "title", text: a.agent || a.id }), h("span", { class: "badge " + a.status, text: a.status })),
				h("div", { class: "meta", text: a.task || "" }),
				h("div", { class: "meta", text: [a.model, tokens(a.tokens) + " tok", "$" + Number(a.cost || 0).toFixed(4)].filter(Boolean).join(" · ") }),
				a.partial ? h("pre", { text: a.partial }) : null,
				cancellable ? h("div", { class: "actions" }, h("button", { class: "danger", text: "Cancel", disabled: pending.has("a:" + a.id),
					onclick: function () { act("a:" + a.id, { action: "cancel-agent", id: a.id }); } })) : null);
		}, "No subagents.");
	}

	function promptBody(p) {
		var busy = pending.has("p:" + p.id);
		var answer = function (value) { act("p:" + p.id, { action: "answer", id: p.id, value: value }); };
		var parts = [];
		if (p.body) parts.push(h("pre", { text: p.body }));
		if (p.kind === "confirm") {
			parts.push(h("div", { class: "actions" },
				h("button", { class: "good", text: "Approve", disabled: busy, onclick: function () { answer(true); } }),
				h("button", { class: "danger", text: "Deny", disabled: busy, onclick: function () { answer(false); } })));
		} else {
			(p.options || []).forEach(function (o, idx) {
				parts.push(h("button", { class: "opt", disabled: busy, onclick: function () { answer(o.label); } },
					h("span", { text: o.label }), p.recommended === idx + 1 ? h("span", { class: "rec", text: "★ recommended" }) : null,
					o.description ? h("span", { class: "d", text: o.description }) : null));
			});
			if (p.allowOther !== false) {
				var input = h("input", { type: "text", placeholder: "Other…", maxlength: "2000" });
				var send = function () { var v = input.value.trim(); if (v) answer(v); };
				input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
				parts.push(h("div", { class: "free" }, input, h("button", { text: "Send", disabled: busy, onclick: send })));
			}
		}
		return parts;
	}
	function drawPrompts() {
		var list = Array.from(state.prompts.values()).sort(function (a, b) {
			return (a.status === "open" ? 0 : 1) - (b.status === "open" ? 0 : 1) || (b.at || 0) - (a.at || 0);
		});
		var open = list.filter(function (p) { return p.status === "open"; }).length;
		$("n-prompts").textContent = open ? open + " open" : "";
		reconcile($("prompts"), list.map(function (p) { return Object.assign({}, p, { _busy: pending.has("p:" + p.id) }); }), function (p) { return p.id; }, function (p) {
			if (p.status === "open") {
				return h.apply(null, ["div", { class: "card" },
					h("div", { class: "row" }, h("span", { class: "title", text: p.title }), h("span", { class: "badge open", text: p.source || "prompt" }))].concat(promptBody(p)));
			}
			var ans = typeof p.answer === "boolean" ? (p.answer ? "approved" : "denied") : String(p.answer == null ? "" : p.answer);
			return h("details", { class: "card" },
				h("summary", {}, h("span", { class: "badge " + p.status, text: p.status }), " ", h("span", { class: "title", text: p.title })),
				h("div", { class: "meta", text: (ans ? "answer: " + ans : "no answer") + (p.by ? " · by " + p.by : "") + (p.at ? " · " + time(p.at) : "") }));
		}, "No prompts.");
	}

	function counts(c) {
		if (c == null) return "";
		if (typeof c !== "object") return String(c);
		return Object.keys(c).map(function (k) { return k + ":" + c[k]; }).join(" ");
	}
	function drawChecks() {
		reconcile($("checks"), state.checks, function (c) { return c.id + ":" + c.at; }, function (c) {
			return h("div", { class: "card" },
				h("div", { class: "row" }, h("span", { class: "badge " + String(c.outcome).toLowerCase(), text: c.outcome }), h("span", { class: "meta", text: [counts(c.counts), c.durationMs != null ? (c.durationMs / 1000).toFixed(1) + "s" : "", time(c.at)].filter(Boolean).join(" · ") })),
				h("div", { class: "mono", text: c.command }));
		}, "No checks yet.");
	}
	function drawTodos() {
		var marks = { done: "✓", completed: "✓", in_progress: "▸", pending: "○" };
		reconcile($("todos"), state.todos, function (t) { return String(t.id); }, function (t) {
			return h("div", { class: "todo " + t.status }, h("span", { class: "mark", text: marks[t.status] || "○" }),
				h("span", { class: "txt", text: t.text + (t.note ? " — " + t.note : "") }));
		}, "No todos.");
	}
	function drawGuard() {
		reconcile($("guard"), state.guard, function (g) { return g.id + ":" + g.at; }, function (g) {
			return h("div", { class: "card" },
				h("div", { class: "row" }, h("span", { class: "badge " + g.action, text: g.action }), h("span", { class: "title", text: g.tool || "" }), h("span", { class: "meta", text: time(g.at) })),
				g.subject ? h("div", { class: "mono", text: g.subject }) : null, g.reason ? h("div", { class: "meta", text: g.reason }) : null);
		}, "No guard decisions.");
	}

	function draw() { drawHeader(); drawTimeline(); drawAgents(); drawPrompts(); drawChecks(); drawTodos(); drawGuard(); }

	// ---- composer ----
	function sendText(mode) {
		var box = $("input"), text = box.value.trim();
		if (!text) return;
		var body = { action: "prompt", text: text };
		if (mode === "steer") body.deliverAs = "steer";
		else if (state.running) body.deliverAs = "followUp";
		act(null, body, function () { box.value = ""; });
	}
	$("send").addEventListener("click", function () { sendText("send"); });
	$("steer").addEventListener("click", function () { sendText("steer"); });
	$("abort").addEventListener("click", function () { act(null, { action: "abort" }); });
	$("input").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendText("send"); } });

	// ---- connection ----
	function setConn(text, cls) { var c = $("conn"); c.textContent = text; c.className = "pill " + cls; }
	function connect() {
		if (!TOKEN) { setConn("no token in the URL", "off"); return; }
		var es = new EventSource("/events?token=" + encodeURIComponent(TOKEN));
		es.onopen = function () { setConn("live", "on"); };
		es.onmessage = function (m) {
			try { fold(JSON.parse(m.data)); } catch (e) { return; }
			render();
		};
		es.onerror = function () {
			if (es.readyState === 2) setConn("disconnected — check the token", "off");
			else setConn("reconnecting…", "off");
		};
	}
	draw();
	connect();
})();
</script>
</body>
</html>
